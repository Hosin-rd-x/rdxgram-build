plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.rdx.gram.theme'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.rdx.gram.theme'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
        }
    }
}

dependencies {
    // Legacy Xposed API, provided by the framework (LSPatch loader) at runtime.
    // Never packaged into the APK.
    compileOnly files('libs/api-82.jar')
}
