// RdxGram Theme module — a tiny standalone Xposed module for Instagram.
// Kotlin + legacy Xposed API only (api-82.jar, compileOnly): one entry,
// one API, minimal hooks, lowest crash surface.
plugins {
    id 'com.android.application' version '8.7.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
