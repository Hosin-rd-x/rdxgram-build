# Build a ready-to-install Instagram + RdxGram Theme APK with LSPatch (no root)
#
# Why 1.2 is a different pipeline from 1.1 (root cause of the 1.1 crash):
#   Theme 1.1 installed fine and LSPatch bootstrapped, the module loaded
#   ("font loaded: Inter variable"), MainTabActivity displayed — then
#   ~2.5 s later InstagramMainActivity died inflating its layout:
#   "Failed to resolve attribute at index 6: TypedValue{t=0x2/d=0x7f040d3e}"
#   (Redroid runs 43597148756 and 43603677487, same crash twice).
#   0x7f040d3e is attr/tabBarHeight (the old "abc_grow_fade_in_from_bottom"
#   name came from a buggy resolver that read entry offsets at
#   entriesStart; the correct parser reads them at headerSize). The
#   activity theme Base.Theme.Instagram defines tabBarHeight as a
#   reference to dimen 0x7f070263 (tab_bar_height_panorama), and that
#   dimen is ABSENT from the stock single base APK: stock Instagram 451
#   is a Play-bundle build whose density config split holds it (and 4
#   more dimens + ~129 drawables). With the reference dangling, theme
#   resolution returns the unresolved attribute and
#   TypedArray.getDimensionPixelSize throws. A LITERAL 48dp in the style
#   item is also wrong (side-by-side 1.2 crashed that way, Redroid run
#   43610901393, "Resource ID #0x0": InstagramMainActivity needs the
#   attribute to resolve to a resource id) — the dimen must exist as a
#   REAL dimension resource at its original id and the style item must
#   point at it by REFERENCE.
#   The side-by-side build (1.4, Redroid probe 43616286704, RUNNING)
#   already proved the fix: apktool decode + rebrand.py repairs
#   (2i split dimens, 2j split drawables/strings, 2k split XML
#   drawables) + aapt2 rebuild + LSPatch. Theme 1.2 runs THE SAME
#   pipeline, but with rebrand.py --keep-package: package stays
#   com.instagram.android (replaces the official app), no rename,
#   no new label, no new icon — only the launch repairs run.
#
# Pipeline (order matters):
#   0. Strip requiredSplitTypes from the stock APK FIRST (before decode):
#      the stock manifest declares requiredSplitTypes='base__density'
#      and the density split is not inside the single APK — without the
#      strip a clean device refuses the install with
#      INSTALL_FAILED_MISSING_SPLIT (emulator run 43588589307).
#   1. Build the RdxGram Theme module from source (rdxgram-theme/, same
#      Gradle build as before): Kotlin + legacy Xposed API only, Inter
#      variable font, floating translucent capsule bottom bar + selected
#      tab pill, settings app with two switches (defaults ON).
#   2. apktool 2.12.0 decodes the stripped stock base APK.
#   3. rebrand.py --keep-package repairs the decoded tree only
#      (layout indirection codes kept, Play-split dimens/drawables/
#      strings/XML drawables restored at original ids). Package,
#      authorities, labels and icons are untouched.
#   4. apktool rebuilds the APK (unsigned).
#   5. The rebuild is pre-signed with testkey (LSPatch 1.0 cannot patch
#      an unsigned APK: "Could not read the original apk's signature"),
#      then LSPatch 1.0 embeds the theme module + loader dex + sig
#      bypass 2 and signs with testkey.
#   6. Verify: package com.instagram.android, label "Instagram",
#      MAIN/LAUNCHER present, module embedded (classes + Inter font
#      SHA), no requiredSplitTypes, layout indirection codes resolve.
#
# Secrets (same as before): TESTKEY_P12_B64 / TESTKEY_PASSWORD.
#
# Output: Instagram-451.0.0.53.80-RdxGram-Theme-<version>-testkey.apk
#   (package com.instagram.android, testkey-signed, RdxGram Theme module
#   embedded under assets/lspatch/modules/ir.rdx.gram.theme.apk).
# Also uploads the standalone module APK (rdxgram-theme-<version>.apk)
# so the settings app can be installed for the on/off switches.

name: Build Instagram + RdxGram Theme (LSPatch)

on:
  workflow_dispatch:
    inputs:
      theme_version:
        description: "Theme release version (used in APK and release names)"
        required: true
        default: "1.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android build-tools 35
        # 35.0.0, NOT 34.0.0: apksigner 34 re-writes the APK with the
        # zip entries in a content-sensitive order, so the
        # resources.arsc offset in the pre-signed APK — and hence in
        # the LSPatch output — swings by tens of MB between runs.
        # apksigner 35 preserves the input zip layout, so the final
        # arsc offset is a deterministic function of the content and
        # the --check-arsc gate is stable (same reason as
        # rdxgram-sidebyside.yml).
        run: |
          ls "$ANDROID_HOME/build-tools"
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "build-tools 35.0.0 missing; installing via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null 2>&1 || echo "sdkmanager install failed (continuing to check)"
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Ensure Android platform 34 (best effort)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" >/dev/null 2>&1 || echo "sdkmanager install skipped (platform may already be present)"
          else
            echo "no sdkmanager; relying on the preinstalled SDK"
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Build RdxGram Theme module APK
        run: |
          cd rdxgram-theme
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk ../rdxgram-theme-${{ inputs.theme_version }}.apk
          cd ..
          ls -la rdxgram-theme-${{ inputs.theme_version }}.apk
          sha256sum rdxgram-theme-${{ inputs.theme_version }}.apk
          "$BT/aapt" dump badging rdxgram-theme-${{ inputs.theme_version }}.apk | head -2
          "$BT/aapt" dump badging rdxgram-theme-${{ inputs.theme_version }}.apk | grep -q "package: name='ir.rdx.gram.theme'"
          echo "MODULE_APK=rdxgram-theme-${{ inputs.theme_version }}.apk" >> "$GITHUB_ENV"

      - name: Verify theme module contents
        run: |
          unzip -l "$MODULE_APK" | grep -q "assets/fonts/Inter-Variable.ttf" || (echo "FONT_ASSET_MISSING" && exit 1)
          unzip -l "$MODULE_APK" | grep -q "META-INF/xposed/module.prop" || (echo "MODULE_PROP_MISSING" && exit 1)
          unzip -l "$MODULE_APK" | grep -q "META-INF/xposed/init" || (echo "XPOSED_INIT_META_MISSING" && exit 1)
          unzip -l "$MODULE_APK" | grep -q "assets/xposed_init" || (echo "XPOSED_INIT_ASSET_MISSING" && exit 1)
          unzip -p "$MODULE_APK" "assets/fonts/Inter-Variable.ttf" > /tmp/inter-check.ttf
          test "$(sha256sum /tmp/inter-check.ttf | cut -d' ' -f1)" = "29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031" || (echo "FONT_SHA_MISMATCH" && exit 1)
          echo "font asset verified: Inter variable, SHA-256 matches"
          # The module MUST be the theme one: entry + both hooks + settings classes.
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/LegacyEntry" || (echo "ENTRY_MISSING" && exit 1)
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/FontHook" || (echo "FONT_HOOK_MISSING" && exit 1)
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/TabBarHook" || (echo "TABBAR_HOOK_MISSING" && exit 1)
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/SettingsProvider" || (echo "SETTINGS_PROVIDER_MISSING" && exit 1)
          unzip -p "$MODULE_APK" "META-INF/xposed/module.prop" | grep -q "minVersion=82" || (echo "MINVERSION_MISSING" && exit 1)
          echo "theme module verified: entry + FontHook + TabBarHook + settings present"

      - name: Download LSPatch 1.0 and apktool 2.12.0, verify sizes
        run: |
          curl -fL --retry 3 -o lspatch-v1.0-455-release.jar https://github.com/JingMatrix/LSPatch/releases/download/v1.0/lspatch-v1.0-455-release.jar
          test "$(stat -c%s lspatch-v1.0-455-release.jar)" = "12092952"
          curl -fL --retry 3 -o apktool_2.12.0.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar
          test "$(stat -c%s apktool_2.12.0.jar)" = "25925346"
          test "$(sha256sum apktool_2.12.0.jar | cut -d' ' -f1)" = "effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd"
          sha256sum lspatch-v1.0-455-release.jar apktool_2.12.0.jar
          java -jar apktool_2.12.0.jar version

      - name: Download stock Instagram 451 base APK (from this repo's release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ig
          gh release download instagram-451.0.0.53.80-stock -p 'instagram-451.0.0.53.80.apk' --repo Hosin-rd-x/rdxgram-build --dir ig
          ls -la ig/
          sha256sum ig/instagram-451.0.0.53.80.apk
          test "$(sha256sum ig/instagram-451.0.0.53.80.apk | cut -d' ' -f1)" = "9eff1efa4591d53f8d97631c67a381a26a01929e093f604b37aa69fdf443d628"
          echo "stock Instagram 451.0.0.53.80 base APK, SHA-256 verified" | tee download.log
          cp ig/instagram-451.0.0.53.80.apk instagram-play.apk

      - name: Inspect downloaded APKs
        run: |
          for f in $(find ig -name '*.apk' | sort); do
            echo "== $f ($(stat -c%s "$f") bytes)"
            "$BT/aapt" dump badging "$f" 2>/dev/null | head -2 || true
            echo "  dex files: $(unzip -l "$f" | grep -c 'classes[0-9]*\.dex' || true)"
            echo "  arm64 .so entries: $(unzip -l "$f" | grep -c 'lib/arm64-v8a/[^ ]*\.so' || true)"
          done
          BASE_APK="$(for f in $(find ig -name '*.apk' | sort); do if unzip -l "$f" | grep -q 'classes[0-9]*\.dex'; then echo "$f"; break; fi; done)"
          test -n "$BASE_APK"
          echo "BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          VERSION_NAME="$("$BT/aapt" dump badging "$BASE_APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$("$BT/aapt" dump badging "$BASE_APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Downloaded Instagram $VERSION_NAME (code $VERSION_CODE)"
          LIBS="$(unzip -l "$BASE_APK" | grep -c 'lib/arm64-v8a/[^ ]*\.so' || true)"
          echo "Base APK native-lib entries: $LIBS"
          if [ "$LIBS" -gt 0 ]; then
            echo "HAS_LIBS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_LIBS=false" >> "$GITHUB_ENV"
            echo "BASE_HAS_NO_NATIVE_LIBS: base APK has no arm64 .so files; splits carry them."
          fi
          "$BT/aapt" dump badging "$BASE_APK" | grep -q "package: name='com.instagram.android'"

      - name: Stop when base APK has no native libs
        if: env.HAS_LIBS != 'true'
        run: |
          echo "BASE_HAS_NO_NATIVE_LIBS"
          exit 1

      - name: Strip requiredSplitTypes from base APK (before decode)
        if: env.HAS_LIBS == 'true'
        run: |
          # Stock Instagram 451 is a Play-bundle build: its manifest
          # declares requiredSplitTypes='base__density', and the density
          # config split is not inside the single base APK — so the APK
          # refuses to install on a clean device (INSTALL_FAILED_MISSING_SPLIT,
          # seen in emulator run 43588589307). Remove that one attribute
          # from the base manifest BEFORE patching/decoding: the decoded
          # manifest then has no such attribute, so the rebuilt APK
          # installs standalone too.
          python3 .github/scripts/strip_required_splits.py ig/instagram-451.0.0.53.80.apk ig/instagram-stripped.apk
          test -s ig/instagram-stripped.apk
          mv ig/instagram-stripped.apk ig/instagram-451.0.0.53.80.apk
          python3 .github/scripts/strip_required_splits.py --check ig/instagram-451.0.0.53.80.apk
          cp ig/instagram-451.0.0.53.80.apk instagram-play.apk
          ls -la ig/

      - name: Decode base APK with apktool
        if: env.HAS_LIBS == 'true'
        run: |
          df -h .
          free -m
          java -jar apktool_2.12.0.jar d -o ig-decoded -f instagram-play.apk 2>&1 | tee apktool-decode.log
          echo "--- decoded tree ---"
          du -sh ig-decoded
          ls ig-decoded/
          test -f ig-decoded/AndroidManifest.xml
          grep -o 'package="[^"]*"' ig-decoded/AndroidManifest.xml | head -1
          grep -q 'package="com.instagram.android"' ig-decoded/AndroidManifest.xml || (echo "DECODED_PACKAGE_WRONG" && exit 1)

      - name: Repair decoded tree (Play-split holes; package kept)
        if: env.HAS_LIBS == 'true'
        run: |
          python3 rdxgram-rebrand/rebrand.py ig-decoded rdxgram-rebrand/icons rdxgram-rebrand/split-drawables rdxgram-rebrand/split-drawables-2k --keep-package 2>&1 | tee rebrand.log
          echo "--- keep-package gates ---"
          grep -q 'package kept: com.instagram.android' rebrand.log || (echo "PACKAGE_NOT_KEPT" && exit 1)
          grep -q 'package="com.instagram.android"' ig-decoded/AndroidManifest.xml || (echo "MANIFEST_PACKAGE_CHANGED" && exit 1)
          # No rename must have happened anywhere in the decoded manifest.
          grep -q "Rdx gram" ig-decoded/AndroidManifest.xml && (echo "RENAME_LEAKED_INTO_MANIFEST" && exit 1) || echo "no rename in manifest"
          grep -q "com.rdx.gram" ig-decoded/AndroidManifest.xml && (echo "RENAME_LEAKED_INTO_MANIFEST" && exit 1) || echo "no rdx package in manifest"
          echo "split repairs (Play density-split dimensions) in styles.xml:"
          grep -q '<item name="tabBarHeight">@dimen/tab_bar_height_panorama</item>' ig-decoded/res/values/styles.xml || (echo "SPLIT_REPAIR_TABBARHEIGHT_MISSING" && exit 1)
          grep -q '<item name="strokeWidth">@dimen/circular_avatar_stroke_width</item>' ig-decoded/res/values/styles.xml || (echo "SPLIT_REPAIR_STROKEWIDTH_MISSING" && exit 1)
          test "$(grep -c '<item name="mediaViewOuterVerticalMargin">@dimen/direct_in_thread_composer_top_margin</item>' ig-decoded/res/values/styles.xml)" = "2" || (echo "SPLIT_REPAIR_MARGIN_COUNT_WRONG" && exit 1)
          grep -q '<dimen name="tab_bar_height_panorama">48dp</dimen>' ig-decoded/res/values/rdx_split_dimens.xml || (echo "SPLIT_DIMEN_TABBARHEIGHT_MISSING" && exit 1)
          grep -q '<dimen name="circular_avatar_stroke_width">2px</dimen>' ig-decoded/res/values/rdx_split_dimens.xml || (echo "SPLIT_DIMEN_STROKEWIDTH_MISSING" && exit 1)
          grep -q '<dimen name="direct_in_thread_composer_top_margin">6dp</dimen>' ig-decoded/res/values/rdx_split_dimens.xml || (echo "SPLIT_DIMEN_MARGIN_MISSING" && exit 1)
          echo "split repairs present: tabBarHeight -> tab_bar_height_panorama 48dp, strokeWidth -> circular_avatar_stroke_width 2px, mediaViewOuterVerticalMargin -> direct_in_thread_composer_top_margin 6dp x2"
          echo "split sweep 2k (Play-split XML drawables) in rebrand.log:"
          grep -q '2k total: 119 drawables, 2 xml stubs, 2 dimens, 131 xml files fixed' rebrand.log || (echo "SPLIT_2K_TOTAL_WRONG" && exit 1)
          grep -q '2k restore drawable input -> 0x7f082185' rebrand.log || (echo "SPLIT_2K_INPUT_MISSING" && exit 1)
          grep -q '2k restore drawable input_highlighted -> 0x7f082188' rebrand.log || (echo "SPLIT_2K_INPUT_HIGHLIGHTED_MISSING" && exit 1)
          grep -q '2k xml fix res/drawable/input_background.xml: 2 replacements (0 left @null)' rebrand.log || (echo "SPLIT_2K_INPUT_BACKGROUND_XML_MISSING" && exit 1)
          echo "split sweep 2k present: login-modal input_background selector + 9-patches restored"

      - name: Rebuild APK with apktool
        if: env.HAS_LIBS == 'true'
        run: |
          df -h .
          java -jar apktool_2.12.0.jar b ig-decoded -o ig-theme.apk 2>&1 | tee apktool-build.log
          ls -la ig-theme.apk
          sha256sum ig-theme.apk
          "$BT/aapt" dump badging ig-theme.apk | head -3
          "$BT/aapt" dump badging ig-theme.apk | grep -q "package: name='com.instagram.android'"
          "$BT/aapt" dump badging ig-theme.apk | grep -q "application-label:'Instagram'" || (echo "APP_LABEL_NOT_INSTAGRAM" && exit 1)
          echo "--- MAIN/LAUNCHER intent filter in rebuilt manifest ---"
          "$BT/aapt" dump xmltree ig-theme.apk AndroidManifest.xml > /tmp/manifest-tree.txt
          grep -q "android.intent.action.MAIN" /tmp/manifest-tree.txt || (echo "NO_MAIN_INTENT_FILTER" && exit 1)
          grep -q "android.intent.category.LAUNCHER" /tmp/manifest-tree.txt || (echo "NO_LAUNCHER_CATEGORY" && exit 1)
          grep -q "com.instagram.android.activity.MainTabActivity" /tmp/manifest-tree.txt || (echo "MAINTAB_ALIAS_MISSING" && exit 1)
          echo "rebuilt APK verified: package com.instagram.android, label 'Instagram', MAIN/LAUNCHER filter present"

      - name: Verify layout indirection survived the rebuild
        if: env.HAS_LIBS == 'true'
        run: |
          python3 .github/scripts/verify_layout_values.py ig-theme.apk

      - name: Patch rebuilt APK with LSPatch (embed theme module, inject loader dex, sig bypass 2)
        if: env.HAS_LIBS == 'true'
        env:
          TESTKEY_P12_B64: ${{ secrets.TESTKEY_P12_B64 }}
          TESTKEY_PASSWORD: ${{ secrets.TESTKEY_PASSWORD }}
        run: |
          test -n "$TESTKEY_P12_B64"
          test -n "$TESTKEY_PASSWORD"
          echo "$TESTKEY_P12_B64" | base64 -d > testkey.p12
          echo "--- pre-sign the apktool rebuild (LSPatch cannot patch an unsigned APK: it logs 'Could not read the original apk's signature' and outputs only origin.apk) ---"
          "$BT/apksigner" sign --ks testkey.p12 --ks-type PKCS12 --ks-pass "pass:$TESTKEY_PASSWORD" --ks-key-alias testkey --key-pass "pass:$TESTKEY_PASSWORD" ig-theme.apk
          "$BT/apksigner" verify --verbose ig-theme.apk || (echo "PRESIGN_VERIFY_FAILED" && exit 1)
          java -jar lspatch-v1.0-455-release.jar \
            -m "$MODULE_APK" \
            --injectdex \
            -l 2 \
            -k testkey.p12 "$TESTKEY_PASSWORD" testkey "$TESTKEY_PASSWORD" \
            -o out -f -v ig-theme.apk 2>&1 | tee lspatch.log
          rm -f testkey.p12
          if grep -q "Could not read the original apk's signature" lspatch.log; then echo "LSPATCH_SIGNATURE_READ_FAILED"; exit 1; fi
          echo "LSPatch read the original signature OK"
          ls -la out/

      - name: Verify patched APK
        if: env.HAS_LIBS == 'true'
        run: |
          PATCHED="$(ls out/*-lspatched.apk | head -1)"
          test -n "$PATCHED"
          PATCHED_APK="Instagram-${VERSION_NAME}-RdxGram-Theme-${{ inputs.theme_version }}-testkey.apk"
          cp "$PATCHED" "$PATCHED_APK"
          echo "PATCHED_APK=$PATCHED_APK" >> "$GITHUB_ENV"
          ls -la "$PATCHED_APK"
          echo "--- patched APK zip listing (diagnostic: aapt cannot read this file) ---"
          unzip -l "$PATCHED_APK" | head -25
          echo "--- manifest check (Python AXML parser: aapt dump badging fails on LSPatch+apktool APKs even though the zip and manifest are valid) ---"
          python3 .github/scripts/verify_apk_manifest.py --expect-package com.instagram.android "$PATCHED_APK"
          echo "--- no requiredSplitTypes + arsc stored and 4-byte aligned ---"
          python3 .github/scripts/strip_required_splits.py --check "$PATCHED_APK"
          python3 .github/scripts/strip_required_splits.py --check-arsc "$PATCHED_APK"
          python3 .github/scripts/verify_layout_values.py "$PATCHED_APK"
          "$BT/apksigner" verify --verbose --print-certs "$PATCHED_APK"
          echo "--- embedded module ---"
          unzip -l "$PATCHED_APK" | grep -i "lspatch/modules" || (echo "MODULE_NOT_EMBEDDED" && exit 1)
          mkdir -p embedded-check
          unzip -o -j "$PATCHED_APK" "assets/lspatch/modules/*" -d embedded-check
          EMBEDDED="$(ls embedded-check/*.apk | head -1)"
          test -n "$EMBEDDED"
          "$BT/aapt" dump badging "$EMBEDDED" | grep -q "package: name='ir.rdx.gram.theme'" || (echo "EMBEDDED_PACKAGE_MISMATCH" && exit 1)
          unzip -p "$EMBEDDED" 'classes*.dex' | grep -q "ir/rdx/gram/theme/LegacyEntry" || (echo "EMBEDDED_ENTRY_MISSING" && exit 1)
          unzip -p "$EMBEDDED" 'classes*.dex' | grep -q "ir/rdx/gram/theme/FontHook" || (echo "EMBEDDED_FONT_HOOK_MISSING" && exit 1)
          unzip -p "$EMBEDDED" 'classes*.dex' | grep -q "ir/rdx/gram/theme/TabBarHook" || (echo "EMBEDDED_TABBAR_HOOK_MISSING" && exit 1)
          unzip -p "$EMBEDDED" "assets/fonts/Inter-Variable.ttf" > /tmp/inter-embedded.ttf
          test "$(sha256sum /tmp/inter-embedded.ttf | cut -d' ' -f1)" = "29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031" || (echo "EMBEDDED_FONT_SHA_MISMATCH" && exit 1)
          echo "embedded module verified: theme module + Inter font inside the final APK"
          echo "--- zipalign (report only; LSPatch output is shipped as-is, like 1.0/1.1) ---"
          "$BT/zipalign" -c -v 4 "$PATCHED_APK" || echo "ZIPALIGN_NOT_ALIGNED (install still works)"
          echo "--- SHA-256 ---"
          sha256sum "$PATCHED_APK"

      - name: Upload APKs
        if: env.HAS_LIBS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-rdxgram-theme
          path: |
            Instagram-*-RdxGram-Theme-${{ inputs.theme_version }}-testkey.apk
            rdxgram-theme-${{ inputs.theme_version }}.apk
            lspatch.log
            download.log
            rebrand.log
            apktool-decode.log
            apktool-build.log
          if-no-files-found: error
          retention-days: 30
