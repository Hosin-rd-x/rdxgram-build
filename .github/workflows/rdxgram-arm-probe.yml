# RdxGram ARM probe — can Redroid (native ARM Android in Docker) run on a
# GitHub ubuntu-24.04-arm runner, and does the RdxGram theme 1.1 APK launch
# in it?
#
# Why this exists: the APK is arm64-only. On the x86_64 emulator it installs
# fine, but launch crashes at process start because the LSPatch loader picks
# the x86_64 native library while the process runs under ARM translation —
# that crash is the emulator's, not the app's. A native ARM run tells the
# truth about whether the app really launches.
#
# Trigger: manual only (workflow_dispatch). Input apk_tag defaults to the
# release under test (currently RdxGram side-by-side 1.4).
# Optional tap_login ("true"): after the 45s launch wait, dump the UI
# hierarchy, tap the "Log in" button on the signed-out screen, wait, and
# capture a second logcat + UI dump. This reproduces the login-tap crash
# Hossein reported on 1.4 (launch is fine, tapping Log in crashes).
# If a login form appears with another "Log in" button, it is tapped too
# (empty submit) and a third logcat is captured. The job still never fails
# on a crash — a crash is a result. Verdicts live in status.txt.
#
# Step 1 (always runs): probe the runner kernel for Android binder/ashmem.
# If binder loads (either /dev/binder or a binderfs mount), steps 2+3 boot
# Redroid, install the APK, launch it with `am start`, wait 45s, capture pid +
# logcat. If neither /dev/binder nor binderfs appears, the Redroid path is
# dead and we stop after step 1 (status.txt = BINDER_MISSING).

name: RdxGram ARM probe (Redroid on ubuntu-24.04-arm)

on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: "Release tag of the already-built APK to test"
        required: true
        default: "instagram-451.0.0.53.80-rdxgram-sidebyside-1.10"
      apk_url:
        description: "Direct APK URL (overrides apk_tag; used for baseline APKs not in a release, e.g. stock InstaPro)"
        required: false
        default: ""
      tap_login:
        description: "Tap the Log in button after launch and capture a second logcat (true/false)"
        required: false
        default: "false"
      tap_target:
        description: "Comma-separated first-tap targets in priority order (default: login entry points)"
        required: false
        default: "I already have a profile,Log in"
      tap_fill:
        description: "Fill dummy credentials and tap Log in to submit (true/false; false = just tap the first target and watch)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  arm-probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out probe workflow + scripts
        uses: actions/checkout@v4

      - name: Probe binder / ashmem
        id: binder
        run: |
          echo "== kernel =="; uname -a
          echo "== /dev/binder* =="; ls -l /dev/binder* 2>&1 || true
          echo "== loaded modules =="; lsmod | grep -E 'binder|ashmem' || echo "no binder/ashmem modules loaded"
          echo "== modprobe binder_linux =="
          if sudo modprobe binder_linux 2>&1; then echo "binder_linux modprobe: OK"; else echo "binder_linux modprobe: FAILED"; fi
          echo "== modprobe ashmem_linux =="
          if sudo modprobe ashmem_linux 2>&1; then echo "ashmem_linux modprobe: OK"; else echo "ashmem_linux modprobe: FAILED"; fi
          ls -l /dev/binder* 2>&1 || true
          if [ ! -e /dev/binder ]; then
            echo "== binder still missing, trying linux-modules-extra =="
            sudo apt-get update -qq 2>&1 | tail -2 || true
            sudo apt-get install -y linux-modules-extra-$(uname -r) 2>&1 | tail -5 || true
            sudo modprobe binder_linux 2>&1 || true
            sudo modprobe ashmem_linux 2>&1 || true
            ls -l /dev/binder* 2>&1 || true
          fi
          # The binder module can load yet still create no /dev/binder node
          # (observed on the 7.0.0-1017-azure kernel). Some kernels only
          # expose binder through binderfs — try mounting it.
          if [ ! -e /dev/binder ]; then
            echo "== binder still missing, trying binderfs mount =="
            sudo mkdir -p /dev/binderfs
            sudo mount -t binder binder /dev/binderfs 2>&1 || echo "binderfs mount FAILED"
            ls -l /dev/binderfs/ 2>&1 || true
          fi
          echo "== final module state =="; lsmod | grep -E 'binder|ashmem' || echo "still no binder/ashmem modules"
          BINDER=no
          BINDERFS=no
          if [ -e /dev/binder ]; then BINDER=yes; fi
          if [ -e /dev/binderfs/binder-control ]; then BINDER=yes; BINDERFS=yes; fi
          echo "binder_present=$BINDER" >> "$GITHUB_OUTPUT"
          echo "binderfs_present=$BINDERFS" >> "$GITHUB_OUTPUT"
          echo "BINDER_PRESENT=$BINDER" > binder.txt
          echo "BINDERFS_PRESENT=$BINDERFS" >> binder.txt
          if [ "$BINDER" = "no" ]; then echo "BINDER_MISSING" > status.txt; else echo "BINDER_PRESENT" > status.txt; fi
          : > logcat.txt
          : > crash.txt
          : > pid.txt
          : > boot-diag.txt
          : > launch.txt
          echo "binder_present=$BINDER"

      - name: Download APK to test
        if: steps.binder.outputs.binder_present == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y gh; fi
          mkdir -p apk
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "downloading APK from URL: ${{ inputs.apk_url }}"
            curl -L --fail -o apk/Instagram-baseline-439.apk "${{ inputs.apk_url }}"
          else
            gh release download "${{ inputs.apk_tag }}" -p '*nstagram-*.apk' --repo "$GITHUB_REPOSITORY" --dir apk
          fi
          ls -la apk
          sha256sum apk/*.apk

      # Some releases (e.g. the base InstaEclipse APK) still declare
      # requiredSplitTypes and cannot install on a clean device at all.
      # If the downloaded APK has it, strip it and re-sign with a throwaway
      # key (the strip drops the APK Signing Block, so a re-sign is
      # mandatory — targetSdk 30+ requires a v2 signature). APKs that are
      # already stripped (theme 1.1, side-by-side) install as downloaded.
      - name: Strip requiredSplitTypes + re-sign if needed
        if: steps.binder.outputs.binder_present == 'yes'
        run: |
          set -x
          APK=$(ls apk/*nstagram-*.apk | head -1)
          echo "downloaded APK: $APK"
          if python3 .github/scripts/strip_required_splits.py --check "$APK"; then
            echo "requiredSplitTypes absent, installing as downloaded"
            echo "INSTALL_APK=$APK" >> "$GITHUB_ENV"
          else
            echo "requiredSplitTypes present, stripping + re-signing with a throwaway key"
            sudo apt-get update -qq
            sudo apt-get install -y apksigner
            python3 .github/scripts/strip_required_splits.py "$APK" apk/stripped.apk
            python3 .github/scripts/strip_required_splits.py --check apk/stripped.apk
            python3 .github/scripts/strip_required_splits.py --check-arsc apk/stripped.apk
            # No zipalign: it refuses LSPatch output ("header mismatch" —
            # the overlapped origin.apk entry). apksigner tolerates it, and
            # the strip script already guarantees resources.arsc alignment.
            openssl req -x509 -newkey rsa:2048 -keyout probe-key.pem -out probe-cert.pem -days 3650 -nodes -subj "/CN=RedroidProbe" 2>/dev/null
            openssl pkcs12 -export -out probe.p12 -inkey probe-key.pem -in probe-cert.pem -passout pass:android
            apksigner sign --ks probe.p12 --ks-type PKCS12 --ks-pass pass:android --ks-key-alias 1 --key-pass pass:android --out apk/signed.apk apk/stripped.apk
            apksigner verify apk/signed.apk && echo "signature verified"
            echo "INSTALL_APK=apk/signed.apk" >> "$GITHUB_ENV"
          fi

      # The package is com.instagram.android for the theme/base builds but
      # com.rdx.gram for the side-by-side build — read it from the APK
      # manifest instead of hardcoding it (the hardcoded check gave a
      # false NOT_INSTALLED for side-by-side 1.0 in run 43599812321).
      - name: Detect package name from the APK manifest
        if: steps.binder.outputs.binder_present == 'yes'
        run: |
          PKG=$(python3 - <<'PY'
          import glob, zipfile, struct
          apk = glob.glob("apk/*nstagram-*.apk")[0]
          with zipfile.ZipFile(apk) as z:
              axml = z.read("AndroidManifest.xml")
          # string pool (UTF-8 or UTF-16)
          flags = struct.unpack_from("<I", axml, 8 + 16)[0]
          count = struct.unpack_from("<I", axml, 8 + 8)[0]
          strings_start = struct.unpack_from("<I", axml, 8 + 20)[0]
          offs = struct.unpack_from(f"<{count}I", axml, 8 + 28)
          pool = axml[8:]
          def get_string(idx):
              p = strings_start + offs[idx]
              if flags & 0x100:
                  b = pool[p]
                  ln, p = ((b & 0x7F) << 8 | pool[p+1], p+2) if b & 0x80 else (b, p+1)
                  b = pool[p]
                  p = p+2 if b & 0x80 else p+1
                  return pool[p:p+ln].decode("utf-8", "replace")
              ln = struct.unpack_from("<H", pool, p)[0]
              p += 2
              if ln & 0x8000:
                  ln = ((ln & 0x7FFF) << 16) | struct.unpack_from("<H", pool, p)[0]
                  p += 2
              return pool[p:p+ln*2].decode("utf-16-le", "replace")
          strings = [get_string(i) for i in range(count)]
          # first START_ELEMENT chunk (<manifest>)
          p = 8 + struct.unpack_from("<I", pool, 4)[0]
          while p < len(axml):
              ctype, hsize, size = struct.unpack_from("<HHI", axml, p)
              if ctype == 0x0102:
                  astart, asize, acount = struct.unpack_from("<HHH", axml, p + 24)
                  for i in range(acount):
                      a = p + 16 + astart + i * asize
                      name_idx = struct.unpack_from("<I", axml, a + 4)[0]
                      if strings[name_idx] == "package":
                          dtype = axml[a + 15]
                          data = struct.unpack_from("<I", axml, a + 16)[0]
                          print(strings[data] if dtype == 3 else data)
                          raise SystemExit(0)
              p += size
          raise SystemExit("package attribute not found")
          PY
          )
          echo "package=$PKG"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Boot Redroid and test the APK
        if: steps.binder.outputs.binder_present == 'yes'
        run: |
          set -x
          docker --version
          if ! command -v adb >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y adb; fi
          adb version
          IMAGE=""
          # Tag scheme verified on Docker Hub (2026-11-14): the arm64-only
          # images are named <ver>_64only-latest (e.g. 13.0.0_64only-latest,
          # multi-arch amd64+arm64). There is NO -arm64 suffix — that was
          # the "manifest unknown" failure in probe run 43595377933.
          # 2026-11-16: Redroid 15 tried FIRST again (env test:
          # Redroid 16 never boots here — surfaceflinger crash-loops
          # in SkiaRenderEngine::primeCache, first_boot_completed=0 —
          # so 16 is unusable as a probe host; 15/14 stay, 13 fallback).
          # 1.10 tests hardwareAccelerated=false against the 14/15
          # native graphics crash, so the probe must run where the
          # feed actually rendered before (Redroid 15).
          for TAG in 15.0.0_64only-latest 14.0.0_64only-latest 13.0.0_64only-latest; do
            if docker pull "redroid/redroid:$TAG"; then IMAGE="redroid/redroid:$TAG"; break; fi
          done
          if [ -z "$IMAGE" ]; then echo "NO_REDROID_IMAGE" > status.txt; exit 0; fi
          echo "using image $IMAGE" | tee -a status.txt
          DOCKER_ARGS="--privileged --name redroid -p 5555:5555"
          if [ -d /dev/binderfs ]; then DOCKER_ARGS="$DOCKER_ARGS -v /dev/binderfs:/dev/binderfs"; fi
          docker run -d $DOCKER_ARGS "$IMAGE"
          # Pin every adb command to the Redroid device: during boot a second
          # adb transport can appear ("more than one device/emulator" killed
          # probe run 43595666260). ANDROID_SERIAL does the pinning.
          export ANDROID_SERIAL=localhost:5555
          for i in $(seq 1 60); do
            adb connect localhost:5555 2>&1 | grep -q "connected" && break
            sleep 5
          done
          adb devices
          adb wait-for-device
          docker ps
          # Redroid first boot is slow on a shared runner: wait up to 10 min
          # for sys.boot_completed instead of 5.
          BOOT=""
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            if [ $((i % 12)) -eq 0 ]; then echo "still booting after $((i * 5))s (boot_completed='$BOOT')"; docker logs redroid --tail 5 2>&1 | tail -5 || true; fi
            sleep 5
          done
          echo "boot_completed='$BOOT'" | tee -a status.txt
          if [ "$BOOT" != "1" ]; then
            echo "== boot diagnostics ==" > boot-diag.txt
            docker ps >> boot-diag.txt 2>&1 || true
            docker logs redroid --tail 80 >> boot-diag.txt 2>&1 || true
            adb shell getprop 2>/dev/null | grep -E 'boot|init\.svc' >> boot-diag.txt || true
            cat boot-diag.txt
          fi
          # Try the install even if boot_completed is not 1 yet; judge by
          # whether the package actually lands, not by the step exit code.
          adb install -r "$INSTALL_APK" || echo "adb install failed (see above)"
          if adb shell pm list packages 2>/dev/null | grep -q "$PKG"; then
            echo "installed" | tee -a status.txt
            # Launch with `am start`, not monkey: monkey exits -5 without
            # launching anything on Redroid 13 (probe run 43596433654 — it
            # aborted right after "SYS_KEYS has no physical keys" and no
            # Instagram process ever started). Give the PackageManager a
            # moment to index the freshly installed package, resolve the
            # launcher activity, then start it explicitly.
            sleep 20
            echo "== launcher activity ==" | tee launch.txt
            LAUNCHER=""
            for i in $(seq 1 6); do
              LAUNCHER=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" 2>/dev/null | tr -d '\r' | tail -1)
              [ -n "$LAUNCHER" ] && break
              sleep 5
            done
            echo "launcher=$LAUNCHER" | tee -a launch.txt
            if [ -n "$LAUNCHER" ]; then
              adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n "$LAUNCHER" 2>&1 | tee -a launch.txt || true
            else
              echo "no launcher activity resolved, trying implicit intent" | tee -a launch.txt
              adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" 2>&1 | tee -a launch.txt || true
            fi
            sleep 45
            adb shell pidof "$PKG" > pid.txt 2>&1 || echo "not-running" > pid.txt
            adb logcat -d > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "CRASHED" > status.txt
            elif [ -s pid.txt ] && [ "$(cat pid.txt)" != "not-running" ]; then
              echo "RUNNING" > status.txt
            else
              echo "NOT_RUNNING_NO_FATAL" > status.txt
            fi
            grep -B2 -A 40 "FATAL EXCEPTION" logcat.txt | head -80 > crash.txt || true
            # --- tap-login phase (only when requested and the app is alive) ---
            echo "tap_login=${{ inputs.tap_login }}" | tee -a timing.txt
            date +%s > timing-launch-epoch.txt
            if [ "${{ inputs.tap_login }}" = "true" ] && [ "$(cat status.txt)" = "RUNNING" ]; then
              echo "== tap-login phase: dump signed-out UI ==" | tee -a timing.txt
              adb shell uiautomator dump /sdcard/ui1.xml 2>&1 | tee -a timing.txt || echo "UIA_DUMP1_FAILED" | tee -a timing.txt
              adb pull /sdcard/ui1.xml ui1.xml 2>&1 | tail -1 || echo "UI1_PULL_FAILED" | tee -a timing.txt
              TAP_START=$(date +%s)
              echo "tap_start_epoch=$TAP_START" >> timing.txt
              python3 .github/scripts/tap_parse.py ui1.xml "${{ inputs.tap_target }}" > tap.txt 2>&1 || echo "TAP_PARSE_FAILED" >> tap.txt
              cat tap.txt
              TAPXY=$(grep -oE '^TAP [0-9]+ [0-9]+$' tap.txt | head -1 || true)
              if [ -n "$TAPXY" ]; then
                set -- $TAPXY
                echo "tapping first target at $2 $3" | tee -a timing.txt
                adb shell input tap "$2" "$3" || echo "TAP_FAILED" | tee -a timing.txt
                sleep 3
              if [ "${{ inputs.tap_fill }}" = "true" ]; then
                # If a login form is now showing, fill dummy credentials so the
                # submit actually runs the login attempt (empty-form submit
                # only shows inline validation and never reaches the crash
                # Hossein reported). Dummy creds cannot authenticate.
                adb shell uiautomator dump /sdcard/ui1b.xml 2>&1 | tee -a timing.txt || echo "UIA_DUMP1B_FAILED" | tee -a timing.txt
                adb pull /sdcard/ui1b.xml ui1b.xml 2>&1 | tail -1 || echo "UI1B_PULL_FAILED" | tee -a timing.txt
                python3 .github/scripts/tap_parse.py ui1b.xml "Log in" > tap1b.txt 2>&1 || echo "TAP1B_PARSE_FAILED" >> tap1b.txt
                cat tap1b.txt
                FILLU=$(grep -oE '^FILL_USER [0-9]+ [0-9]+$' tap1b.txt | head -1 || true)
                FILLP=$(grep -oE '^FILL_PASS [0-9]+ [0-9]+$' tap1b.txt | head -1 || true)
                if [ -n "$FILLU" ]; then
                  set -- $FILLU
                  adb shell input tap "$2" "$3" || true; sleep 1
                  adb shell input text testuser123 || true; sleep 1
                  echo "filled dummy username" | tee -a timing.txt
                fi
                if [ -n "$FILLP" ]; then
                  set -- $FILLP
                  # Focus check (same quirk fixed in ig_login_drive.py,
                  # commit 430e2e19): tapping the password field does not
                  # always move focus off the username field, so typing
                  # then appends the password to the username and the
                  # submit never runs (seen in the 1.8 fake probe:
                  # username became "testuser123testpass123"). Dump,
                  # verify the password field is focused, re-tap once
                  # if it is not.
                  adb shell input tap "$2" "$3" || true; sleep 1
                  adb shell uiautomator dump /sdcard/ui1b2.xml 2>&1 | tee -a timing.txt || true
                  adb pull /sdcard/ui1b2.xml ui1b2.xml 2>&1 | tail -1 || true
                  if ! python3 -c "import sys, xml.etree.ElementTree as ET; t = ET.parse('ui1b2.xml'); sys.exit(0 if any(n.get('content-desc','').startswith('Password,') and n.get('focused')=='true' for n in t.iter()) else 1)"; then
                    echo "password field not focused after first tap — re-tapping" | tee -a timing.txt
                    adb shell input tap "$2" "$3" || true; sleep 1
                  fi
                  adb shell input text testpass123 || true; sleep 1
                  echo "filled dummy password" | tee -a timing.txt
                fi
                adb shell input keyevent 111 || true
                sleep 1
                # re-dump: the keyboard may have shifted the layout
                adb shell uiautomator dump /sdcard/ui1c.xml 2>&1 | tee -a timing.txt || echo "UIA_DUMP1C_FAILED" | tee -a timing.txt
                adb pull /sdcard/ui1c.xml ui1c.xml 2>&1 | tail -1 || echo "UI1C_PULL_FAILED" | tee -a timing.txt
                # Regression check: the username field must still hold
                # exactly the dummy username. If the password leaked
                # into it, clear both fields and refill once.
                if ! python3 -c "import sys, xml.etree.ElementTree as ET; t = ET.parse('ui1c.xml'); sys.exit(0 if any((n.get('text') or '')=='testuser123' for n in t.iter() if n.get('content-desc','').startswith('Username,')) else 1)"; then
                  echo "FILL_REGRESSION: username field changed — refilling once" | tee -a timing.txt
                  python3 .github/scripts/tap_parse.py ui1c.xml "Log in" > tap1c0.txt 2>&1 || true
                  FU2=$(grep -oE '^FILL_USER [0-9]+ [0-9]+$' tap1c0.txt | head -1 || true)
                  FP2=$(grep -oE '^FILL_PASS [0-9]+ [0-9]+$' tap1c0.txt | head -1 || true)
                  if [ -n "$FU2" ]; then
                    set -- $FU2
                    adb shell input tap "$2" "$3" || true; sleep 1
                    adb shell input keyevent 113 || true; sleep 1
                    adb shell input text testuser123 || true; sleep 1
                  fi
                  if [ -n "$FP2" ]; then
                    set -- $FP2
                    adb shell input tap "$2" "$3" || true; sleep 1
                    adb shell input keyevent 113 || true; sleep 1
                    adb shell input text testpass123 || true; sleep 1
                  fi
                  adb shell uiautomator dump /sdcard/ui1c2.xml 2>&1 | tee -a timing.txt || true
                  adb pull /sdcard/ui1c2.xml ui1c2.xml 2>&1 | tail -1 || true
                  python3 .github/scripts/tap_parse.py ui1c2.xml "Log in" > tap1c.txt 2>&1 || echo "TAP1C_PARSE_FAILED" >> tap1c.txt
                else
                  python3 .github/scripts/tap_parse.py ui1c.xml "Log in" > tap1c.txt 2>&1 || echo "TAP1C_PARSE_FAILED" >> tap1c.txt
                fi
                cat tap1c.txt
                TAPXY=$(grep -oE '^TAP [0-9]+ [0-9]+$' tap1c.txt | head -1 || grep -oE '^TAP [0-9]+ [0-9]+$' tap1b.txt | head -1 || true)
                if [ -n "$TAPXY" ]; then
                  set -- $TAPXY
                  echo "tapping Log in (submit) at $2 $3" | tee -a timing.txt
                  adb shell input tap "$2" "$3" || echo "TAP_SUBMIT_FAILED" | tee -a timing.txt
                else
                  echo "no Log in button to submit (see ui1b/ui1c)" | tee -a timing.txt
                fi
              fi
              else
                echo "no first target to tap (see ui1.xml / tap.txt)" | tee -a timing.txt
              fi
              sleep 25
              TAP_END=$(date +%s)
              echo "tap_end_epoch=$TAP_END tap_to_result_seconds=$((TAP_END - TAP_START))" >> timing.txt
              adb shell pidof "$PKG" > pid2.txt 2>&1 || echo "not-running" > pid2.txt
              adb logcat -d > logcat2.txt
              grep -B2 -A 40 "FATAL EXCEPTION" logcat2.txt | head -80 > crash2.txt || true
              adb shell uiautomator dump /sdcard/ui2.xml 2>&1 | tee -a timing.txt || echo "UIA_DUMP2_FAILED" | tee -a timing.txt
              adb pull /sdcard/ui2.xml ui2.xml 2>&1 | tail -1 || echo "UI2_PULL_FAILED" | tee -a timing.txt
              echo "pid_after_tap=$(cat pid2.txt | tr -d '\n')" | tee -a timing.txt
              if grep -q "FATAL EXCEPTION" logcat2.txt; then
                echo "CRASHED_AFTER_LOGIN_TAP" | tee -a status.txt
              elif [ "$(cat pid2.txt)" != "not-running" ]; then
                echo "ALIVE_AFTER_LOGIN_TAP" | tee -a status.txt
                # If a login form is still showing, tap its Log in button once more.
                python3 .github/scripts/tap_parse.py ui2.xml "Log in" > tap2.txt 2>&1 || echo "TAP2_PARSE_FAILED" >> tap2.txt
                cat tap2.txt
                TAP2=$(grep -oE '^TAP [0-9]+ [0-9]+$' tap2.txt | head -1 || true)
                if [ -n "$TAP2" ]; then
                  set -- $TAP2
                  echo "tapping form Log in at $2 $3" | tee -a timing.txt
                  adb shell input tap "$2" "$3" || echo "TAP2_FAILED" | tee -a timing.txt
                  sleep 20
                  adb shell pidof "$PKG" > pid3.txt 2>&1 || echo "not-running" > pid3.txt
                  adb logcat -d > logcat3.txt
                  grep -B2 -A 40 "FATAL EXCEPTION" logcat3.txt | head -80 > crash3.txt || true
                  if grep -q "FATAL EXCEPTION" logcat3.txt; then echo "CRASHED_AFTER_FORM_LOGIN_TAP" | tee -a status.txt; else echo "ALIVE_AFTER_FORM_LOGIN_TAP" | tee -a status.txt; fi
                fi
              else
                echo "NOT_RUNNING_AFTER_LOGIN_TAP_NO_FATAL" | tee -a status.txt
              fi
              echo "=== tap phase done ==="; cat timing.txt
            fi
          else
            echo "NOT_INSTALLED" > status.txt
            if [ "$BOOT" != "1" ]; then echo "NOT_BOOTED" >> status.txt; fi
            adb logcat -d > logcat.txt || true
          fi
          echo "=== status ==="; cat status.txt
          echo "=== pid ==="; cat pid.txt
          echo "=== crash excerpt ==="; cat crash.txt

      - name: Upload probe results (always)
        if: always()
        uses: actions/upload-artifact@v4
