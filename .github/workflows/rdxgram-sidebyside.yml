# Build a SIDE-BY-SIDE Instagram + RdxGram Theme APK (LSPatch, no root)
#
# Final form Hossein asked for (2026-11-14): the app installs NEXT TO the
# official Instagram — package com.rdx.gram, app name "Rdx gram", his own
# launcher icon — so the official app and its data/login are never
# touched. InstaPro (com.instapro.android) already proved on his phone
# (2026-11-07) that a renamed package installs and logs in side-by-side.
#
# Pipeline (order matters, decided from the failure modes):
#   0. Strip requiredSplitTypes from the stock APK FIRST (before decode):
#      the stock Instagram is a Play-bundle build whose manifest declares
#      requiredSplitTypes='base__density', and the density split is NOT
#      inside the single APK — without the strip a clean device refuses
#      the install with INSTALL_FAILED_MISSING_SPLIT (proven by the
#      theme-1.1 emulator test, run 43588589307). Same step as
#      rdxgram-theme.yml; the manifest size change must stay a multiple
#      of 4 and the manifest DEFLATED, or resources.arsc alignment breaks.
#   1. Build the RdxGram Theme module from source (rdxgram-theme/, same
#      Gradle build as rdxgram-theme.yml). The module hooks BOTH
#      com.instagram.android and com.rdx.gram.
#   2. apktool 2.12.0 decodes the stripped stock base APK (module NOT
#      embedded yet: decoding a patched APK would round-trip LSPatch's
#      loader dex through smali for no benefit).
#   3. rebrand.py edits the decoded tree only: manifest package,
#      provider authorities + custom permissions, literal manifest
#      labels "Rdx gram" (IG 451 has no app_name string — the label is a
#      shrunk string id 0x7f130009, name "(name removed)"), launcher
#      icons (pre-baked PNGs in rdxgram-rebrand/icons: icon.png,
#      ig_launcher_background/foreground layers, internal_icon),
#      monochrome stripped from the adaptive-icon XML. The layout
#      indirection codes are KEPT (steps 2d/2d2/2e): stock 451 stores
#      its 6,049 layouts as string values in resources.arsc, most of
#      them "L|..." codes the app's own inflater resolves with
#      getString() at launch — deleting them (rebrand v1) kept only
#      66 layouts and launch died on 0x7f0e0949 (Redroid 43600558276).
#      2d moves each code into an rdx_layout_* string and points the
#      layouts.xml item at it, 2e never prunes a <public> entry that
#      a values XML defines, and 2f/2h only prune @layout references
#      to layouts with neither a file nor a layouts.xml item.
#      And 2i repairs the Play-split dimension holes: the stock APK
#      is only the base of a Play bundle, and three dimensions the
#      launch theme needs live only in a config split (their style
#      items decode as @null) — tabBarHeight 48dp, Avatar strokeWidth
#      2px, mediaViewOuterVerticalMargin 6dp (values from the matching
#      mapping in the full InstaPro 439 APK). Without 2i even the
#      stock APK crashes at launch on Redroid (run 43603677487).
#      No dex edits, no class renames.
#   4. apktool rebuilds the renamed APK (unsigned).
#   5. LSPatch 1.0 embeds the theme module + loader dex + sig bypass 2 and
#      signs with testkey — the same proven flags as rdxgram-theme.yml.
#      BUT: LSPatch 1.0 cannot patch an UNSIGNED apktool rebuild — its log
#      says "Could not read the original apk's signature" and the output
#      is degenerate (a zip holding only assets/lspatch/origin.apk, no
#      manifest at all; seen in run 43594917967). So ig-renamed.apk is
#      first signed with the same testkey (apksigner) and only then
#      patched; the patch step fails fast if LSPatch still cannot read
#      the signature. NOTE: the rebuilt APK can never carry Instagram's
#      original Meta signature, so sig bypass 2 here can only present
#      the testkey signature to the app — login with the test account
#      is an open question for the phone test (InstaPro, also re-signed,
#      did log in on Hossein's phone 2026-11-07, so it may be fine).
#   6. Verify: package com.rdx.gram, label "Rdx gram" (application label
#      via badging + literal labels in the decoded manifest — aapt badging
#      does NOT list a launchable-activity when the launcher entries are
#      activity-aliases, so the MAIN/LAUNCHER filter is checked in the
#      manifest tree with aapt dump xmltree instead), icon dimensions
#      per density (icon + bg/fg layers + internal_icon), module
#      embedded (classes + Inter font SHA), no requiredSplitTypes,
#      layout indirection codes verified (0x7f0e0949 resolves to an
#      "L|..." code, ~6,049 layouts present), apksigner OK.
#
# Honest risk (also in the release notes): Instagram checks its own
# signature/package; base 451 + LSPatch + rename has NEVER been phone-tested
# and login with the test account, or even opening the app, may fail. The
# non-renamed build from rdxgram-theme.yml (theme 1.1) stays the verified
# fallback for the install mechanism — this workflow never blocks on it.
#
# Secrets: TESTKEY_P12_B64 / TESTKEY_PASSWORD (testkey keystore, never in logs).
#
# Output: Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk
#   (package com.rdx.gram, testkey-signed, theme module embedded).

name: Build Instagram + RdxGram Theme SIDE-BY-SIDE (LSPatch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android build-tools 34
        run: |
          ls "$ANDROID_HOME/build-tools"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          echo "BT=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Ensure Android platform 34 (best effort)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || echo "sdkmanager install skipped (platform may already be present)"
          else
            echo "no sdkmanager; relying on the preinstalled SDK"
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Build RdxGram Theme module APK
        run: |
          cd rdxgram-theme
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk ../rdxgram-theme-1.0.apk
          cd ..
          ls -la rdxgram-theme-1.0.apk
          sha256sum rdxgram-theme-1.0.apk
          "$BT/aapt" dump badging rdxgram-theme-1.0.apk | head -2
          "$BT/aapt" dump badging rdxgram-theme-1.0.apk | grep -q "package: name='ir.rdx.gram.theme'"
          echo "MODULE_APK=rdxgram-theme-1.0.apk" >> "$GITHUB_ENV"

      - name: Verify theme module contents
        run: |
          unzip -l "$MODULE_APK" | grep -q "assets/fonts/Inter-Variable.ttf" || (echo "FONT_ASSET_MISSING" && exit 1)
          unzip -l "$MODULE_APK" | grep -q "META-INF/xposed/module.prop" || (echo "MODULE_PROP_MISSING" && exit 1)
          unzip -l "$MODULE_APK" | grep -q "META-INF/xposed/init" || (echo "XPOSED_INIT_META_MISSING" && exit 1)
          unzip -l "$MODULE_APK" | grep -q "assets/xposed_init" || (echo "XPOSED_INIT_ASSET_MISSING" && exit 1)
          unzip -p "$MODULE_APK" "assets/fonts/Inter-Variable.ttf" > /tmp/inter-check.ttf
          test "$(sha256sum /tmp/inter-check.ttf | cut -d' ' -f1)" = "29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031" || (echo "FONT_SHA_MISMATCH" && exit 1)
          echo "font asset verified: Inter variable, SHA-256 matches"
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/LegacyEntry" || (echo "ENTRY_MISSING" && exit 1)
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/FontHook" || (echo "FONT_HOOK_MISSING" && exit 1)
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/TabBarHook" || (echo "TABBAR_HOOK_MISSING" && exit 1)
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -q "ir/rdx/gram/theme/SettingsProvider" || (echo "SETTINGS_PROVIDER_MISSING" && exit 1)
          unzip -p "$MODULE_APK" 'classes*.dex' | grep -qF "com.rdx.gram" || (echo "SIDEBYSIDE_PACKAGE_FILTER_MISSING" && exit 1)
          echo "theme module verified: entry + hooks + side-by-side package filter present"

      - name: Download LSPatch 1.0 and apktool 2.12.0, verify sizes
        run: |
          curl -fL --retry 3 -o lspatch-v1.0-455-release.jar https://github.com/JingMatrix/LSPatch/releases/download/v1.0/lspatch-v1.0-455-release.jar
          test "$(stat -c%s lspatch-v1.0-455-release.jar)" = "12092952"
          curl -fL --retry 3 -o apktool_2.12.0.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar
          test "$(stat -c%s apktool_2.12.0.jar)" = "25925346"
          test "$(sha256sum apktool_2.12.0.jar | cut -d' ' -f1)" = "effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd"
          sha256sum lspatch-v1.0-455-release.jar apktool_2.12.0.jar
          java -jar apktool_2.12.0.jar version

      - name: Download stock Instagram 451 base APK (from this repo's release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ig
          gh release download instagram-451.0.0.53.80-stock -p 'instagram-451.0.0.53.80.apk' --repo Hosin-rd-x/rdxgram-build --dir ig
          ls -la ig/
          sha256sum ig/instagram-451.0.0.53.80.apk
          test "$(sha256sum ig/instagram-451.0.0.53.80.apk | cut -d' ' -f1)" = "9eff1efa4591d53f8d97631c67a381a26a01929e093f604b37aa69fdf443d628"
          echo "stock Instagram 451.0.0.53.80 base APK, SHA-256 verified" | tee download.log
          cp ig/instagram-451.0.0.53.80.apk instagram-play.apk

      - name: Strip requiredSplitTypes from base APK (before decode)
        run: |
          python3 .github/scripts/strip_required_splits.py --check ig/instagram-451.0.0.53.80.apk || true
          python3 .github/scripts/strip_required_splits.py ig/instagram-451.0.0.53.80.apk ig/instagram-stripped.apk
          test -s ig/instagram-stripped.apk
          mv ig/instagram-stripped.apk ig/instagram-451.0.0.53.80.apk
          python3 .github/scripts/strip_required_splits.py --check ig/instagram-451.0.0.53.80.apk
          cp ig/instagram-451.0.0.53.80.apk instagram-play.apk
          ls -la ig/instagram-451.0.0.53.80.apk instagram-play.apk

      - name: Decode base APK with apktool
        run: |
          df -h .
          free -m
          java -jar apktool_2.12.0.jar d -o ig-decoded -f instagram-play.apk 2>&1 | tee apktool-decode.log
          echo "--- decoded tree ---"
          du -sh ig-decoded
          ls ig-decoded/
          test -f ig-decoded/AndroidManifest.xml
          grep -o 'package="[^"]*"' ig-decoded/AndroidManifest.xml | head -1
          echo "providers with instagram authority:"
          grep -o 'android:authorities="[^"]*"' ig-decoded/AndroidManifest.xml | head -20 || true
          echo "custom permissions:"
          grep -o '<permission android:name="[^"]*"' ig-decoded/AndroidManifest.xml | head -10 || true
          grep -o '<uses-permission android:name="com\.instagram[^"]*"' ig-decoded/AndroidManifest.xml | head -10 || true
          echo "launcher icon files (the real names on IG 451 — no ic_launcher.png exists):"
          ls ig-decoded/res/mipmap-*/icon.png ig-decoded/res/mipmap-*/ig_launcher_*.png 2>/dev/null || true
          ls ig-decoded/res/mipmap-anydpi*/ 2>/dev/null || echo "no mipmap-anydpi*"
          echo "label string id in public.xml:"
          grep 'id="0x7f130009"' ig-decoded/res/values/public.xml || echo "label id 0x7f130009 not in public.xml"
          echo "app_name occurrences:"
          grep -rl 'name="app_name"' ig-decoded/res/values*/strings.xml 2>/dev/null || echo "APP_NAME_NOT_FOUND_IN_STRINGS (expected — IG 451 has no app_name)"

      - name: Rebrand decoded tree (package + name + icon)
        run: |
          python3 rdxgram-rebrand/rebrand.py ig-decoded rdxgram-rebrand/icons 2>&1 | tee rebrand.log
          echo "--- manifest after rebrand ---"
          grep -o 'package="[^"]*"' ig-decoded/AndroidManifest.xml | head -1
          grep -o 'android:authorities="[^"]*"' ig-decoded/AndroidManifest.xml | head -20 || true
          grep -rn 'com\.instagram\.android' ig-decoded/AndroidManifest.xml | head -20 || echo "no com.instagram.android left in manifest"
          echo "literal 'Rdx gram' labels in manifest:"
          grep -c 'android:label="Rdx gram"' ig-decoded/AndroidManifest.xml
          test "$(grep -c 'android:label="Rdx gram"' ig-decoded/AndroidManifest.xml)" -ge 3 || (echo "MANIFEST_LABELS_TOO_FEW (expected application + activities + aliases)" && exit 1)
          test ! -f ig-decoded/res/mipmap-anydpi-v26/ic_launcher.xml || (echo "ADAPTIVE_ICON_STILL_PRESENT" && exit 1)
          echo "adaptive icon XMLs after rebrand:"
          grep -rl "monochrome" ig-decoded/res/mipmap-*/icon.xml 2>/dev/null && (echo "MONOCHROME_STILL_PRESENT" && exit 1) || echo "no monochrome layer left in adaptive icons"
          echo "split repairs (Play density-split dimensions) in styles.xml:"
          grep -q '<item name="tabBarHeight">48.0dip</item>' ig-decoded/res/values/styles.xml || (echo "SPLIT_REPAIR_TABBARHEIGHT_MISSING" && exit 1)
          grep -q '<item name="strokeWidth">2.0px</item>' ig-decoded/res/values/styles.xml || (echo "SPLIT_REPAIR_STROKEWIDTH_MISSING" && exit 1)
          test "$(grep -c '<item name="mediaViewOuterVerticalMargin">6.0dip</item>' ig-decoded/res/values/styles.xml)" = "2" || (echo "SPLIT_REPAIR_MARGIN_COUNT_WRONG" && exit 1)
          echo "split repairs present: tabBarHeight 48dp, strokeWidth 2px, mediaViewOuterVerticalMargin 6dp x2"

      - name: Rebuild renamed APK with apktool
        run: |
          df -h .
          java -jar apktool_2.12.0.jar b ig-decoded -o ig-renamed.apk 2>&1 | tee apktool-build.log
          ls -la ig-renamed.apk
          sha256sum ig-renamed.apk
          "$BT/aapt" dump badging ig-renamed.apk | head -3
          "$BT/aapt" dump badging ig-renamed.apk | grep -q "package: name='com.rdx.gram'"
          "$BT/aapt" dump badging ig-renamed.apk | grep -q "application-label:'Rdx gram'" || (echo "APP_LABEL_NOT_RDX_GRAM" && exit 1)
          echo "--- MAIN/LAUNCHER intent filter in rebuilt manifest ---"
          echo "NOTE: aapt dump badging does NOT list a launchable-activity when the"
          echo "launcher entries are activity-aliases (as on IG 451: MainTabActivity"
          echo "and InternalLauncher aliases carry MAIN/LAUNCHER), so check the"
          echo "manifest tree directly instead of badging."
          "$BT/aapt" dump xmltree ig-renamed.apk AndroidManifest.xml > /tmp/manifest-tree.txt
          grep -q "android.intent.action.MAIN" /tmp/manifest-tree.txt || (echo "NO_MAIN_INTENT_FILTER" && exit 1)
          grep -q "android.intent.category.LAUNCHER" /tmp/manifest-tree.txt || (echo "NO_LAUNCHER_CATEGORY" && exit 1)
          grep -q "com.instagram.android.activity.MainTabActivity" /tmp/manifest-tree.txt || (echo "MAINTAB_ALIAS_MISSING" && exit 1)
          grep -q "Rdx gram" /tmp/manifest-tree.txt || (echo "RDX_GRAM_LABEL_MISSING_IN_MANIFEST_TREE" && exit 1)
          echo "renamed APK verified: package com.rdx.gram, label 'Rdx gram', MAIN/LAUNCHER filter present"

      - name: Verify layout indirection survived the rebuild
        run: |
          python3 .github/scripts/verify_layout_values.py ig-renamed.apk

      - name: Verify renamed icon dimensions
        run: |
          python3 - <<'PYEOF'
          import struct, sys, zipfile
          # icon.png per density (the launcher icon @mipmap/icon on IG 451),
          # adaptive-icon layer PNGs (108/162/216/324/432), and
          # internal_icon in its stock per-density format (webp mdpi-hdpi-xhdpi,
          # png xxhdpi-xxxhdpi). All must be Hossein's icon, not IG's.
          icon_px = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
                     "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          layer_px = {"mipmap-mdpi": 108, "mipmap-hdpi": 162, "mipmap-xhdpi": 216,
                      "mipmap-xxhdpi": 324, "mipmap-xxxhdpi": 432}
          z = zipfile.ZipFile("ig-renamed.apk")
          names = z.namelist()
          def png_size(data, name):
              assert data[:8] == b"\x89PNG\r\n\x1a\n", name + " is not a PNG"
              return struct.unpack(">II", data[16:24])
          def webp_size(data, name):
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", name + " is not a WebP"
              # VP8L (lossless) chunk: 'VP8L' + 4-byte size + 1 flag byte + 14 bits w-1 + 14 bits h-1
              assert data[12:16] == b"VP8L", name + " is not a lossless WebP"
              b = data[21:25]
              v = int.from_bytes(b, "little")
              return (v & 0x3FFF) + 1, ((v >> 14) & 0x3FFF) + 1
          problems = []
          for d, px in icon_px.items():
              p = f"res/{d}/icon.png"
              if p not in names:
                  problems.append("MISSING " + p); continue
              if png_size(z.read(p), p) != (px, px):
                  problems.append(f"SIZE_WRONG {p}: {png_size(z.read(p), p)} expected {(px, px)}")
          for d, px in layer_px.items():
              for layer in ("ig_launcher_background.png", "ig_launcher_foreground.png"):
                  p = f"res/{d}/{layer}"
                  if p not in names:
                      problems.append("MISSING " + p); continue
                  if png_size(z.read(p), p) != (px, px):
                      problems.append(f"SIZE_WRONG {p}: {png_size(z.read(p), p)} expected {(px, px)}")
          for d, px in icon_px.items():
              ext = "webp" if d in ("mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi") else "png"
              p = f"res/{d}/internal_icon.{ext}"
              if p not in names:
                  problems.append("MISSING " + p); continue
              data = z.read(p)
              got = webp_size(data, p) if ext == "webp" else png_size(data, p)
              if got != (px, px):
                  problems.append(f"SIZE_WRONG {p}: {got} expected {(px, px)}")
          # adaptive icon XML must have no monochrome layer left
          for p in names:
              if p.startswith("res/mipmap-") and p.endswith("/icon.xml"):
                  xml = z.read(p).decode("utf-8", errors="replace")
                  if "monochrome" in xml:
                      problems.append("MONOCHROME_STILL_PRESENT in " + p)
          if problems:
              print("ICON_CHECK_FAILED:")
              for x in problems:
                  print("  - " + x)
              sys.exit(1)
          print("icon check passed: icon.png + bg/fg layers + internal_icon all present at the right sizes, no monochrome")
          PYEOF

      - name: Patch renamed APK with LSPatch (embed theme module, inject loader dex, sig bypass 2)
        env:
          TESTKEY_P12_B64: ${{ secrets.TESTKEY_P12_B64 }}
          TESTKEY_PASSWORD: ${{ secrets.TESTKEY_PASSWORD }}
        run: |
          test -n "$TESTKEY_P12_B64"
          test -n "$TESTKEY_PASSWORD"
          echo "$TESTKEY_P12_B64" | base64 -d > testkey.p12
          echo "--- pre-sign the apktool rebuild (LSPatch cannot patch an unsigned APK: it logs 'Could not read the original apk's signature' and outputs only origin.apk) ---"
          "$BT/apksigner" sign --ks testkey.p12 --ks-type PKCS12 --ks-pass "pass:$TESTKEY_PASSWORD" --ks-key-alias testkey --key-pass "pass:$TESTKEY_PASSWORD" ig-renamed.apk
          "$BT/apksigner" verify --verbose ig-renamed.apk || (echo "PRESIGN_VERIFY_FAILED" && exit 1)
          java -jar lspatch-v1.0-455-release.jar \
            -m "$MODULE_APK" \
            --injectdex \
            -l 2 \
            -k testkey.p12 "$TESTKEY_PASSWORD" testkey "$TESTKEY_PASSWORD" \
            -o out -f -v ig-renamed.apk 2>&1 | tee lspatch.log
          rm -f testkey.p12
          if grep -q "Could not read the original apk's signature" lspatch.log; then echo "LSPATCH_SIGNATURE_READ_FAILED"; exit 1; fi
          echo "LSPatch read the original signature OK"
          ls -la out/

      - name: Verify patched side-by-side APK
        run: |
          PATCHED="$(ls out/*-lspatched.apk | head -1)"
          test -n "$PATCHED"
          cp "$PATCHED" "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          ls -la "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          echo "--- patched APK zip listing (diagnostic: aapt cannot read this file) ---"
          unzip -l "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk" | head -25
          echo "--- manifest check (Python AXML parser) ---"
          echo "aapt dump badging fails on LSPatch+apktool APKs ('no AndroidManifest.xml"
          echo "found') even though the zip and manifest are valid — Android and"
          echo "Python's zipfile read them fine — so the patched APK is verified"
          echo "with .github/scripts/verify_apk_manifest.py instead of aapt."
          python3 .github/scripts/verify_apk_manifest.py --expect-package com.rdx.gram --expect-label "Rdx gram" "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          python3 .github/scripts/strip_required_splits.py --check "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          python3 .github/scripts/strip_required_splits.py --check-arsc "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          python3 .github/scripts/verify_layout_values.py "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          "$BT/apksigner" verify --verbose --print-certs "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          echo "--- embedded module ---"
          unzip -l "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk" | grep -i "lspatch/modules" || (echo "MODULE_NOT_EMBEDDED" && exit 1)
          mkdir -p embedded-check
          unzip -o -j "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk" "assets/lspatch/modules/*" -d embedded-check
          EMBEDDED="$(ls embedded-check/*.apk | head -1)"
          test -n "$EMBEDDED"
          "$BT/aapt" dump badging "$EMBEDDED" | grep -q "package: name='ir.rdx.gram.theme'" || (echo "EMBEDDED_PACKAGE_MISMATCH" && exit 1)
          unzip -p "$EMBEDDED" 'classes*.dex' | grep -q "ir/rdx/gram/theme/LegacyEntry" || (echo "EMBEDDED_ENTRY_MISSING" && exit 1)
          unzip -p "$EMBEDDED" 'classes*.dex' | grep -q "ir/rdx/gram/theme/FontHook" || (echo "EMBEDDED_FONT_HOOK_MISSING" && exit 1)
          unzip -p "$EMBEDDED" 'classes*.dex' | grep -q "ir/rdx/gram/theme/TabBarHook" || (echo "EMBEDDED_TABBAR_HOOK_MISSING" && exit 1)
          unzip -p "$EMBEDDED" "assets/fonts/Inter-Variable.ttf" > /tmp/inter-embedded.ttf
