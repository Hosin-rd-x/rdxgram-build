          echo "embedded module verified: theme module + Inter font inside the final APK"
          echo "--- zipalign (report only) ---"
          "$BT/zipalign" -c -v 4 "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk" || echo "ZIPALIGN_NOT_ALIGNED (install still works)"
          echo "--- SHA-256 ---"
          sha256sum "Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk"
          echo "PATCHED_APK=Instagram-451.0.0.53.80-RdxGram-SideBySide-1.1-testkey.apk" >> "$GITHUB_ENV"

