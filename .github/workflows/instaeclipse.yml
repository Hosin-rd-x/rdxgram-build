# Build a ready-to-install Instagram + InstaEclipse APK with LSPatch (no root)
#
# Instagram source: Google Play via goopdl 2.0.0.
#   - Account mode (used when the repo secrets exist): env vars
#     GOOPDL_ACCOUNT_EMAIL + GOOPDL_AAS_TOKEN (an `aas_et/...` token,
#     obtained once with `goopdl auth login --print` — a browser sign-in,
#     no password is ever typed into goopdl). goopdl then downloads
#     without the token dispenser.
#   - Anonymous mode (fallback): tokens from Aurora Store's public
#     dispenser. VERIFIED 2026-11-10: the dispenser returns HTTP 403 for
#     every device profile from GitHub Actions runners (run 42718937615)
#     and is unreachable from the sandbox — anonymous is currently dead.
# APKMirror is NOT used: it returns HTTP 403 (Cloudflare) to automated
# requests (run 42717570041); download_instagram.py is superseded.
# Play serves the NEWEST Instagram version, not 451 — the exact version
# downloaded is recorded in the logs and in the output file name.
# InstaEclipse 0.8.2 was tested on 451/452 and finds its targets with
# DexKit, so a newer Play version is expected to work but is NOT
# guaranteed — the phone test decides.
#
# Split-APK note: Play delivers Instagram as base + config splits. The
# workflow inspects whether the base APK already contains native libs.
# If it does, the base is patched directly. If it does not, the run
# stops with a clear BASE_HAS_NO_NATIVE_LIBS marker (patch step
# skipped) and the packaging decision is made from the inspection data.
#
# Inputs (all public, nothing secret):
#   - InstaEclipse 0.8.2 module APK, from the official GitHub release
#     Xposed-Modules-Repo/ps.reso.instaeclipse, tag 20-0.8.2-L
#     (InstaEclipse-0.8.2.apk, 15,621,572 B, new Xposed API for LSPatch 1.0+)
#   - LSPatch 1.0 CLI jar (lspatch-v1.0-455-release.jar, 12,092,952 B),
#     from the official JingMatrix/LSPatch release, tag v1.0.
#     CLI flags verified against LSPatch.java at tag v1.0:
#       -m/--embed, --injectdex, -l/--sigbypasslv (0/1/2, default 0),
#       -o/--output, -f/--force, -v/--verbose, -k/--keystore (4 args).
#     The manager flow in InstaEclipse's README uses "Local Patch Mode" +
#     "Inject loader dex", which is -m + --injectdex on the CLI.
#     Sig bypass level 2 (pm+openat) is the documented choice for apps
#     that verify their own signature (Instagram checks it on login).
#   - Official Instagram APK, latest from Google Play via goopdl 2.0.0
#     (anonymous Aurora tokens). The stock APK is NEVER committed.
#
# Secrets (same as build.yml):
#   - TESTKEY_P12_B64 : base64 of the AOSP testkey PKCS#12 keystore
#   - TESTKEY_PASSWORD: <redacted>
#   The keystore and password NEVER appear in this repo, in logs, or in
#   workflow files. LSPatch signs the output with this keystore via -k.
#
# Output: Instagram-<VERSION>-InstaEclipse-0.8.2-testkey.apk
#   (package com.instagram.android, testkey-signed, InstaEclipse embedded
#   under assets/lspatch/modules/ps.reso.instaeclipse.apk).
#   No glass bottom bar in this build — the base only. The glass bar is a
#   separate custom module/patch, built after the base is phone-tested.

name: Build Instagram + InstaEclipse (LSPatch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android build-tools 34
        run: |
          ls "$ANDROID_HOME/build-tools"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          echo "BT=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Download InstaEclipse 0.8.2 and LSPatch 1.0, verify sizes
        run: |
          curl -fL --retry 3 -o InstaEclipse-0.8.2.apk https://github.com/Xposed-Modules-Repo/ps.reso.instaeclipse/releases/download/20-0.8.2-L/InstaEclipse-0.8.2.apk
          test "$(stat -c%s InstaEclipse-0.8.2.apk)" = "15621572"
          curl -fL --retry 3 -o lspatch-v1.0-455-release.jar https://github.com/JingMatrix/LSPatch/releases/download/v1.0/lspatch-v1.0-455-release.jar
          test "$(stat -c%s lspatch-v1.0-455-release.jar)" = "12092952"
          sha256sum InstaEclipse-0.8.2.apk lspatch-v1.0-455-release.jar

      - name: Show LSPatch CLI usage (flags on the exact jar)
        run: java -jar lspatch-v1.0-455-release.jar --help

      - name: Install goopdl 2.0.0 (anonymous Play downloader)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install 'goopdl==2.0.0'
          else
            python3 -m pip install --user -q 'goopdl==2.0.0'
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          goopdl --version

      - name: Download Instagram from Google Play (goopdl)
        env:
          GOOPDL_ACCOUNT_EMAIL: ${{ secrets.GOOPDL_ACCOUNT_EMAIL }}
          GOOPDL_AAS_TOKEN: ${{ secrets.GOOPDL_AAS_TOKEN }}
        run: |
          goopdl auth status || true
          goopdl latest com.instagram.android 2>&1 | tee latest.txt
          mkdir -p ig
          goopdl download com.instagram.android -a arm64 --splits -o ig 2>&1 | tee download.log
          echo "--- downloaded files ---"
          find ig -type f | sort
          du -sh ig

      - name: Inspect downloaded APKs
        run: |
          for f in $(find ig -name '*.apk' | sort); do
            echo "== $f ($(stat -c%s "$f") bytes)"
            "$BT/aapt" dump badging "$f" 2>/dev/null | head -2 || true
            echo "  dex files: $(unzip -l "$f" | grep -c 'classes[0-9]*\.dex' || true)"
            echo "  arm64 .so entries: $(unzip -l "$f" | grep -c 'lib/arm64-v8a/[^ ]*\.so' || true)"
          done
          BASE_APK="$(for f in $(find ig -name '*.apk' | sort); do if unzip -l "$f" | grep -q 'classes[0-9]*\.dex'; then echo "$f"; break; fi; done)"
          test -n "$BASE_APK"
          echo "BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          VERSION_NAME="$("$BT/aapt" dump badging "$BASE_APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$("$BT/aapt" dump badging "$BASE_APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Downloaded Instagram $VERSION_NAME (code $VERSION_CODE)"
          LIBS="$(unzip -l "$BASE_APK" | grep -c 'lib/arm64-v8a/[^ ]*\.so' || true)"
          echo "Base APK native-lib entries: $LIBS"
          if [ "$LIBS" -gt 0 ]; then
            echo "HAS_LIBS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_LIBS=false" >> "$GITHUB_ENV"
            echo "BASE_HAS_NO_NATIVE_LIBS: base APK has no arm64 .so files; splits carry them."
          fi
          "$BT/aapt" dump badging "$BASE_APK" | grep -q "package: name='com.instagram.android'"
          cp "$BASE_APK" instagram-play.apk
          sha256sum instagram-play.apk

      - name: Stop when base APK has no native libs
        if: env.HAS_LIBS != 'true'
        run: |
          echo "BASE_HAS_NO_NATIVE_LIBS"
          echo "The Play base APK carries no arm64 native libraries; they live in the config splits."
          echo "See the Inspect step above for the per-file table. Packaging decision needed (merge or .apks)."
          exit 1

      - name: Patch with LSPatch (embed InstaEclipse, inject loader dex, sig bypass 2)
        if: env.HAS_LIBS == 'true'
        env:
          TESTKEY_P12_B64: ${{ secrets.TESTKEY_P12_B64 }}
          TESTKEY_PASSWORD: <redacted>
        run: |
          test -n "$TESTKEY_P12_B64"
          test -n "$TESTKEY_PASSWORD"
          echo "$TESTKEY_P12_B64" | base64 -d > testkey.p12
          java -jar lspatch-v1.0-455-release.jar \
            -m InstaEclipse-0.8.2.apk \
            --injectdex \
            -l 2 \
            -k testkey.p12 "$TESTKEY_PASSWORD" testkey "$TESTKEY_PASSWORD" \
            -o out -f -v instagram-play.apk 2>&1 | tee lspatch.log
          rm -f testkey.p12
          ls -la out/

      - name: Verify patched APK
        if: env.HAS_LIBS == 'true'
        run: |
          PATCHED="$(ls out/*-lspatched.apk | head -1)"
          test -n "$PATCHED"
          cp "$PATCHED" "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk"
          ls -la "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk"
          "$BT/aapt" dump badging "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk" | head -3
          "$BT/aapt" dump badging "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk" | grep -q "package: name='com.instagram.android'"
          "$BT/apksigner" verify --verbose --print-certs "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk"
          echo "--- embedded module ---"
          unzip -l "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk" | grep -i "lspatch/modules" || (echo "MODULE_NOT_EMBEDDED" && exit 1)
          echo "--- zipalign (report only) ---"
          "$BT/zipalign" -c -v 4 "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk" || echo "ZIPALIGN_NOT_ALIGNED (install still works)"
          echo "--- SHA-256 ---"
          sha256sum "Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk"
          echo "PATCHED_APK=Instagram-${VERSION_NAME}-InstaEclipse-0.8.2-testkey.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        if: env.HAS_LIBS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-instaeclipse-play
          path: |
            Instagram-*-InstaEclipse-0.8.2-testkey.apk
            lspatch.log
            latest.txt
            download.log
          if-no-files-found: error
          retention-days: 30
